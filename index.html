<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#232323" />
    <title>Aeronet · G2</title>
    <style>
      :root {
        --surface: #232323;
        --card: #2c2c2c;
        --line: #3a3a3a;
        --text: #e5e5e5;
        --muted: #9aa09a;
        --accent: #8fe39a;
        --warn: #e3c58f;
        --danger: #e39a9a;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--surface);
        color: var(--text);
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }

      #app {
        display: flex;
        justify-content: center;
        padding: 16px 16px 24px;
      }

      .panel {
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* ── Cabecera ─────────────────────────────────────────────── */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .brand {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.18em;
      }

      .status {
        font-size: 11px;
        letter-spacing: 0.04em;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
        max-width: 60%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .status-open { color: var(--accent); border-color: #3f6b46; }
      .status-connecting { color: var(--warn); border-color: #6b5f3f; }
      .status-error, .status-closed { color: var(--danger); border-color: #6b4444; }

      .screen { display: flex; flex-direction: column; gap: 12px; }

      /* ── Pantalla de vuelo ────────────────────────────────────── */
      .flighthead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .chip {
        font-size: 10px;
        letter-spacing: 0.14em;
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .chip.is-live { color: var(--accent); border-color: #3f6b46; }

      .timer {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 34px;
        font-weight: 600;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.01em;
      }
      .timer.is-low { color: var(--danger); }

      .lockwrap { display: flex; flex-direction: column; gap: 6px; }
      .locktop {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--accent);
      }
      .locktop .times { font-variant-numeric: tabular-nums; }
      .bar {
        height: 8px;
        border-radius: 999px;
        background: #1b1b1b;
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #5fae6b, var(--accent));
        transition: width 0.35s ease;
      }

      .warn {
        align-self: flex-start;
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--danger);
        border: 1px solid #6b4444;
        border-radius: 999px;
        padding: 4px 10px;
      }
      /* Misil encima: mismo aviso, pero sin duda de que hay que romper. */
      .warn.is-missile {
        color: #1a1010;
        background: var(--danger);
        border-color: var(--danger);
        font-weight: 700;
      }

      canvas#radar {
        width: 100%;
        max-width: 260px;
        aspect-ratio: 1;
        align-self: center;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: #141414;
      }

      ul.contacts {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .contact {
        display: grid;
        grid-template-columns: 16px 1fr auto auto;
        align-items: center;
        gap: 10px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 12px;
      }
      .contact.is-locked { border-color: var(--accent); }
      .contact.is-stale { opacity: 0.5; }
      .contact.is-stale .arrow { color: var(--muted); }
      .contact .arrow { color: var(--accent); text-align: center; }
      .contact .name { font-size: 14px; font-weight: 600; }
      .contact .bearing { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .contact .dist { font-size: 14px; font-variant-numeric: tabular-nums; }

      .empty {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        padding: 10px 0;
      }

      .result {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        text-align: center;
      }
      .result strong { display: block; font-size: 18px; margin-bottom: 2px; }
      .result span { font-size: 12px; color: var(--muted); }
      .result .rec { display: block; font-size: 11px; color: var(--muted); }
      .result .next {
        margin-top: 8px;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--accent);
      }

      .flightfoot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
      }
      .gps { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .gps.is-warn { color: var(--warn); }
      .footbtns { display: flex; gap: 8px; }
      button.ghost.is-off { color: var(--muted); border-style: dashed; }

      /* ── Objetivos de la ronda ─────────────────────────────── */
      .objectives { display: flex; flex-direction: column; gap: 4px; }      .objectives .score {
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }
      .objectives .obj {
        font-size: 10.5px;
        letter-spacing: 0.08em;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .objectives .obj.is-primary { color: var(--warn); }
      .objectives .obj.is-done { color: var(--accent); text-decoration: line-through; }

      /* ── Ficha del avion que llevas ────────────────────────── */
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px 14px;
        font-size: 11px;
        color: var(--muted);
      }
      .stats .stat {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px solid #2c2c2c;
        padding-bottom: 3px;
      }
      .stats .stat b {
        color: var(--text);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .stats .special {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
        border-top: 1px solid #2c2c2c;
        padding-top: 6px;
        font-size: 10.5px;
        line-height: 1.35;
      }
      .stats .special b {
        color: var(--accent);
        letter-spacing: 0.06em;
        flex: none;
      }

      /* ── Lobby ────────────────────────────────────────────────── */
      .field { display: flex; flex-direction: column; gap: 6px; }

      label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
      }

      input {
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--text);
        padding: 11px 12px;
        font-size: 15px;
        font-family: inherit;
        outline: none;
      }
      input:focus { border-color: #5c7a60; }

      .hangar { display: flex; flex-direction: column; gap: 10px; }
      .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
      .tab {
        flex: none;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        padding: 7px 13px;
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .tab.is-active {
        color: #16221a;
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
      }

      .sheet {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--card);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 11px;
      }
      .sheet-head { display: flex; align-items: baseline; gap: 9px; }
      .sheet-name { font-size: 17px; font-weight: 600; }
      .sheet-role {
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .sheet-blurb { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
      .sheet-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
      .sheet-stat {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 11.5px;
        color: var(--muted);
        border-bottom: 1px solid #333;
        padding-bottom: 4px;
      }
      .sheet-stat b {
        color: var(--text);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .sheet-special {
        display: flex;
        gap: 8px;
        border-top: 1px solid #333;
        padding-top: 9px;
        font-size: 11px;
        line-height: 1.4;
        color: var(--muted);
      }
      .sheet-special b {
        flex: none;
        color: var(--accent);
        letter-spacing: 0.06em;
      }

      /* ── Comparador de aviones ─────────────────────────────── */
      .hangar .linkish { align-self: flex-end; }
      .compare { overflow-x: auto; }
      .compare table { width: 100%; border-collapse: collapse; font-size: 10px; }
      .compare th,
      .compare td { padding: 5px 4px; text-align: right; white-space: nowrap; }
      .compare thead th {
        color: var(--muted);
        font-weight: 500;
        font-size: 9px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border-bottom: 1px solid var(--line);
      }
      .compare tbody th {
        text-align: left;
        color: var(--text);
        font-weight: 600;
        font-size: 11px;
      }
      .compare td { color: var(--muted); font-variant-numeric: tabular-nums; }
      .compare tbody tr { border-bottom: 1px solid #2c2c2c; cursor: pointer; }
      .compare tbody tr.is-active { background: #263329; }
      .compare tbody tr.is-active th,
      .compare tbody tr.is-active td { color: var(--accent); }

      .advanced { border-top: 1px solid var(--line); padding-top: 10px; }
      .advanced summary {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        cursor: pointer;
        padding: 4px 0;
      }
      .advanced input { margin-top: 8px; font-size: 13px; }

      button.primary {
        width: 100%;
        background: var(--accent);
        color: #16221a;
        border: 0;
        border-radius: 12px;
        padding: 14px;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      button.primary:active { transform: translateY(1px); }

      button.ghost {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 10px;
        padding: 9px 14px;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
      }

      .location { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .location.is-warn { color: var(--warn); }

      /* ── Tutorial ─────────────────────────────────────────── */
      .tutart {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 84px;
        padding: 6px 0;
      }
      .tutart svg {
        stroke: var(--accent);
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
      }
      .tutart .tuticon svg { width: 132px; height: 72px; }
      .tuttitle { margin: 0; font-size: 19px; font-weight: 600; }
      .tutbody { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--muted); }
      .tutrows {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 11px;
        width: 100%;
      }
      .tutrows li {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .tutrows b { color: var(--text); font-weight: 600; }
      .tutglyph { flex: none; display: flex; }
      .tutglyph svg { width: 30px; height: 30px; color: var(--accent); }
      .tutnav { display: flex; gap: 8px; margin-top: 4px; }
      .tutnav .primary { flex: 1; padding: 13px; font-size: 14px; }
      .tutnav .ghost { padding: 13px 16px; font-size: 13px; }
      .tutnav .ghost:disabled { opacity: 0.35; }
      /* Paso de gestos: texto primero, lista despues. */
      #tutorial.has-rows .tutart { order: 4; }
      #tutorial.has-rows .tutnav { order: 5; }

      button.linkish {
        align-self: flex-start;
        background: none;
        border: 0;
        padding: 2px 0;
        font: inherit;
        font-size: 11.5px;
        color: var(--muted);
        text-decoration: underline;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main class="panel">
        <header class="topbar">
          <span class="brand">AERONET</span>
          <span id="status" class="status status-idle">Sin conectar</span>
        </header>

        <section id="tutorial" class="screen" hidden>
          <span id="tutstep" class="chip">Paso 1 de 4</span>
          <div id="tutart" class="tutart"></div>
          <h2 id="tuttitle" class="tuttitle">Esto es Aeronet</h2>
          <p id="tutbody" class="tutbody"></p>
          <div class="tutnav">
            <button id="tutprev" class="ghost" type="button">Atras</button>
            <button id="tutskip" class="ghost" type="button">Saltar</button>
            <button id="tutnext" class="primary" type="button">Siguiente</button>
          </div>
        </section>

        <section id="flight" class="screen" hidden>
          <div class="flighthead">
            <span id="phase" class="chip">EN VUELO</span>
            <span id="link" class="chip" hidden></span>
            <span id="timer" class="timer">--:--</span>
          </div>

          <div id="objectives" class="objectives"></div>

          <div id="lockwrap" class="lockwrap" hidden>
            <div class="locktop">
              <span id="locklabel">Bloqueando</span>
              <span id="locktime" class="times">0 / 0 s</span>
            </div>
            <div class="bar"><i id="lockfill"></i></div>
          </div>

          <div id="warn" class="warn" hidden></div>

          <canvas id="radar" width="260" height="260" aria-label="Radar táctico"></canvas>

          <ul id="contacts" class="contacts" aria-live="polite"></ul>

          <div id="stats" class="stats"></div>

          <div id="result" class="result" hidden></div>

          <div class="flightfoot">
            <span id="gps" class="gps">GPS listo</span>
            <div class="footbtns">
              <button id="radio" class="ghost" type="button">Radio ON</button>
              <button id="disconnect" class="ghost" type="button">Desconectar</button>
            </div>
          </div>
        </section>

        <section id="lobby" class="screen">
          <section class="field">
            <label for="callsign">Indicativo</label>
            <input id="callsign" type="text" maxlength="12" autocomplete="off" spellcheck="false" />
          </section>

          <section class="field">
            <label>Aeronave</label>
            <div id="aircraft" class="hangar">
              <div id="tabs" class="tabs" role="group" aria-label="Elegir aeronave"></div>
              <div id="sheet" class="sheet"></div>
              <button id="compare" class="linkish" type="button" aria-expanded="false" aria-controls="compare-table">Comparar</button>
              <div id="compare-table" class="compare" hidden></div>
            </div>
          </section>

          <details class="advanced">
            <summary>Servidor</summary>
            <input id="server" type="text" autocomplete="off" spellcheck="false" />
          </details>

          <button id="connect" class="primary" type="button">Conectar</button>

          <div id="location" class="location">GPS: buscando señal…</div>

          <button id="howto" class="linkish" type="button">Cómo se juega</button>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
